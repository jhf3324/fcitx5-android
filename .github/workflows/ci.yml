name: Commit CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**/**'
      - '!*.md'
      - '!.gitignore'

permissions:
  contents: write

jobs:
  build_commit:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-22.04
        abi:
          - arm64-v8a
    env:
      BUILD_ABI: ${{ matrix.abi }}
    steps:
      - name: Fetch source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Fetch upstream tags
        run: |
          git remote add upstream https://github.com/fcitx5-android/fcitx5-android.git || true
          git fetch upstream --tags

      - name: Remove non-semver local tags to avoid confusion
        run: |
          git for-each-ref --format='%(refname:strip=2)' refs/tags | while read tag; do
              if [[ ! "$tag" =~ ^v?[0-9]+(\.[0-9]+)+(-.*)?$ ]]; then
              git tag -d "$tag" || true
            fi
          done

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android environment
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager --install "cmake;3.22.1"

      - name: Install system dependencies (Ubuntu)
        if: ${{ matrix.os == 'ubuntu-22.04' }}
        run: |
          sudo apt update
          sudo apt install extra-cmake-modules gettext

      - name: Prepare personal build sources
        env:
          FCITX5_RIME_REPO: https://github.com/fcitx/fcitx5-rime.git
          PREBUILT_REPO: https://github.com/boomker/f5a-prebuilt.git
          PREBUILDER_REPO: https://github.com/boomker/f5a-prebuilder.git
        run: |
          ./prepare_personal_build.sh

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3

      - name: Setup signing key
        id: sign_setup
        shell: bash
        env:
          SIGN_KEY_BASE64: ${{ secrets.SIGNING_KEY }}
          SIGN_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGN_KEY_PWD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$SIGN_KEY_BASE64" ] && [ -n "$SIGN_KEY_ALIAS" ] && [ -n "$SIGN_KEY_PWD" ]; then
            echo "Using configured signing secrets"
            echo "SIGN_KEY_ALIAS=$SIGN_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "SIGN_KEY_PWD=$SIGN_KEY_PWD" >> "$GITHUB_ENV"
            echo "SIGN_KEY_BASE64<<EOF" >> "$GITHUB_ENV"
            echo "$SIGN_KEY_BASE64" >> "$GITHUB_ENV"
            echo "EOF" >> "$GITHUB_ENV"
          else
            echo "::warning::Signing secrets not configured 鈥?generating temporary CI signing key"
            keytool -genkey -v -keystore ci_release.keystore -alias ci_key \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass cipass -keypass cipass \
              -dname "CN=CI, OU=CI, O=CI, L=Unknown, ST=Unknown, C=CN" 2>/dev/null
            echo "SIGN_KEY_FILE=$(pwd)/ci_release.keystore" >> "$GITHUB_ENV"
            echo "SIGN_KEY_ALIAS=ci_key" >> "$GITHUB_ENV"
            echo "SIGN_KEY_PWD=cipass" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        shell: bash
        run: |
          ./gradlew -PincludeMainlineFlavor=true clean ":app:assembleMainlineRelease" ":assembleReleasePlugins"
          mkdir -p app/build/outputs/apk/release/
          mv "app/build/outputs/apk/mainline/release"/*.apk app/build/outputs/apk/release/

      # move plugin apks to app/build/outputs/apk/release
      - name: Move plugin APKs
        shell: bash
        run: |
          for i in $(ls plugin)
          do
            if [ -d "plugin/${i}" ]
            then
              mv "plugin/${i}/build/outputs/apk/release"/*.apk "app/build/outputs/apk/release/" 2>/dev/null || true
            fi
          done

      - name: Verify signed APKs
        shell: bash
        run: |
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          if [ ${#apks[@]} -eq 0 ]
          then
            echo "::error::No APKs produced in app/build/outputs/apk/release"
            exit 1
          fi

          for apk in "${apks[@]}"
          do
            if [[ "$apk" == *-unsigned.apk ]]
            then
              echo "::error::Unsigned APK detected: $apk"
              exit 1
            fi
          done

          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$sdk_root" ]
          then
            echo "::error::ANDROID_SDK_ROOT or ANDROID_HOME is not set"
            exit 1
          fi

          apksigner=$(find "$sdk_root/build-tools" -type f -name apksigner | sort -V | tail -n1)
          if [ -z "$apksigner" ]
          then
            echo "::error::Failed to locate apksigner under $sdk_root/build-tools"
            exit 1
          fi

          for apk in "${apks[@]}"
          do
            "$apksigner" verify --print-certs "$apk"
          done
        
      - name: Upload app with plugins
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.os }}-${{ matrix.abi }}-with-plugins
          path: app/build/outputs/apk/release/*.apk

      # only keep main APK (no "plugin" in name) and RIME plugin
      - name: Filter APKs for release
        shell: bash
        run: |
          mkdir -p app/build/outputs/apk/release_filtered
          for apk in app/build/outputs/apk/release/*.apk; do
            name="$(basename "$apk")"
            if [[ ! "$name" == *".plugin."* ]] || [[ "$name" == *".plugin.rime."* ]]; then
              cp "$apk" app/build/outputs/apk/release_filtered/
              echo "Keeping: $name"
            else
              echo "Skipping: $name"
            fi
          done

      - name: Create Nightly release
        uses: 'marvinpinto/action-automatic-releases@latest'
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          automatic_release_tag: latest
          prerelease: true
          title: "Nightly Build"
          files: |
            app/build/outputs/apk/release_filtered/*.apk

